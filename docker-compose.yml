version: '3.9'
services:
    mysql:
        image: mysql:8.0
        container_name: mysql8
        restart: always
        environment: 
            MYSQL_ROOT_PASSWORD: root123
            MYSQL_DATABASE: base0
            MYSQL_USER: usuario
            MYSQL_PASSWORD: usuario123
        ports:
            - "3307:3306"
        volumes:
            - ./mysql_data:/var/lib/mysql
        command:
            --default-authentication-plugin=mysql_native_password
        networks:
            - mysql_net

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: phpmyadmin
        restart: always
        ports:
            - "8090:80"
        environment:
            PMA_HOST: mysql
            PMA_USER: root
            PMA_PASSWORD: root123
        depends_on:
            - mysql
        networks:
            - mysql_net

    web:
        build: .
        container_name: web
        restart: always
        volumes:
            - ./www:/var/www/html
        ports:
            - "8081:80"
        depends_on:
            - mysql
        networks:
            - mysql_net

networks:
    mysql_net:
        driver: bridge